{{define "content"}}
<div class="space-y-6">
    <div class="flex items-center justify-between flex-wrap gap-2">
        <div>
            <h1 class="text-2xl font-bold">Transaktionen: {{.TargetUser.FullName}}</h1>
            <p class="text-sm text-base-content/60">
                {{.TargetUser.Email}} · Guthaben: <span class="font-mono {{if lt .TargetUser.Balance 0}}text-error{{else}}text-success{{end}}">{{formatCents .TargetUser.Balance}}</span>
            </p>
        </div>
        <a href="/admin/users" class="btn btn-ghost btn-sm">← Benutzerliste</a>
    </div>

    <div id="admin-user-transaction-list">
        {{template "admin-user-transaction-list" .}}
    </div>
</div>
{{end}}
